# Cloud Run job for the worker (spec v3 D33): one pass that sends due emails and runs the daily
# digest and Friday drafter when due. Cloud Scheduler starts it every minute. Template filled
# by the deploy scripts; it uses the API image.
apiVersion: run.googleapis.com/v1
kind: Job
metadata:
  name: ${WORKER_JOB}
  labels:
    project: feedback
    environment: ${DEPLOY_ENV}
    application: worker
    owner: digital-team
    purpose: feedback-email-and-schedules
    deployment-type: cloud-run-job
  annotations:
    run.googleapis.com/launch-stage: GA
spec:
  template:
    metadata:
      labels:
        project: feedback
        environment: ${DEPLOY_ENV}
        application: worker
        owner: digital-team
      annotations:
        run.googleapis.com/cloudsql-instances: ${CLOUDSQL_INSTANCE}
    spec:
      taskCount: 1
      template:
        spec:
          serviceAccountName: ${WORKER_SA}
          timeoutSeconds: 300
          maxRetries: 0
          containers:
            - image: ${API_IMAGE}
              command: ["python", "-m", "app.worker", "--once"]
              resources:
                limits:
                  cpu: "1"
                  memory: 512Mi
              env:
                - {name: APP_ENV, value: "${DEPLOY_ENV}"}
                - {name: APP_BASE_URL, value: "${APP_BASE_URL}"}
                - {name: MODEL_PROVIDER, value: "${MODEL_PROVIDER}"}
                - {name: EMAIL_BACKEND, value: "${EMAIL_BACKEND}"}
                - {name: SMTP_HOST, value: "${SMTP_HOST}"}
                - {name: SMTP_PORT, value: "${SMTP_PORT}"}
                - {name: SMTP_STARTTLS, value: "${SMTP_STARTTLS}"}
                - {name: SMTP_USERNAME, value: "${SMTP_USERNAME}"}
                - {name: MAIL_FROM, value: "${MAIL_FROM}"}
                - {name: GMAIL_SENDER, value: "${GMAIL_SENDER}"}
                - name: DATABASE_URL
                  valueFrom: {secretKeyRef: {name: feedback-${DEPLOY_ENV}-database-url, key: latest}}
                - name: SECRET_KEY
                  valueFrom: {secretKeyRef: {name: feedback-${DEPLOY_ENV}-secret-key, key: latest}}
                - name: SMTP_PASSWORD
                  valueFrom: {secretKeyRef: {name: feedback-${DEPLOY_ENV}-smtp-password, key: latest}}
