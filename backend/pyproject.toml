[project]
name = "feedback-desk"
version = "0.1.0"
description = "Feedback Desk API, agent and worker"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "email-validator>=2.3.0",
    "fastapi>=0.141.1",
    "google-adk==2.12.0",
    "google-cloud-storage>=3.17.1",
    "httpx>=0.28.1",
    "openpyxl>=3.1.5",
    "pgvector>=0.5.1",
    "pydantic>=2",
    "pydantic-settings>=2.16.0",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "sqlalchemy[asyncio]>=2",
    "sse-starlette>=3.5.0",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pgserver>=0.1.4",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
    "types-openpyxl>=3.1.5.20261017",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
filterwarnings = ["ignore::UserWarning"]

[tool.ruff]
line-length = 120
extend-exclude = ["alembic/versions"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["app", "agent", "evals"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "pgserver.*", "asyncpg.*", "sse_starlette.*", "google.cloud.*", "docx.*"]
ignore_missing_imports = true
