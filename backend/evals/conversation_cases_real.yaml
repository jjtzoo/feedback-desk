# Conversation cases written from how staff really chat: they push back, change the subject,
# answer a different question, mistype, vent, joke, and come back after the card. They try to
# break Sig, not confirm it. Same format as conversation_set.yaml; run on real Gemini only,
# never the stub.
#
# messages: what the person types, in order (the harness stops early once a card shows when
#   expect is card)
# expect:   card    (a confirm card appears) | no_card (no card, nothing saved)
# require:  at least one of these appears in the agent's replies (case-insensitive)
# forbid:   none of these appears in the agent's replies (case-insensitive)
#
# Extra keys for a per-turn code rubric (run_conversations.py does not read them yet):
# good:         what a good support person would do in this chat
# card:         the card a good support person would show (project, kind, impact); absent for no_card
# chips:        one entry per message: the chips expected under Sig's reply to it
#                 tools     the catalogue tools plus "Not sure"
#                 no_impact any chips, or none, but never Blocking my work / Slowing me down / Nice-to-have
#                 none      no chips
#                 card      the confirm card shows here
#                 after     the card is already up; Sig updates it, no new chips
# never_ask:    questions that must never be asked in this chat
# never_repeat: questions that may be asked once but must never be asked again
# after_card:   true when the later messages come after the card; the harness must keep sending
#               them instead of stopping at the first card
# asks_details: true when Sig must ask about the problem itself (not the tool, the impact or "send it?")
#               at least once before the card (D63, review item 23)
# revised:      why and when a case was changed after it was written (the record keeps the reason)
# keeps:        the card's title, summary or what happened says one of these: nothing they said was dropped
#
# Checked on every reply of every case:
#   1. no question asked twice (same meaning, any wording)
#   2. chips match the question just asked (tool question: tools; yes/no: yes/no; no question: none)
#   3. at most 2 lines per reply
#   4. no dashes as punctuation (— or –, or " - " between clauses)
#   5. no card unless the person reported something (a problem, idea, access need or praise)
#   6. impact never asked when the person already said it (slow, down, can't work, not urgent)
cases:

  # The three real failures from the product owner's review notes, 26 Oct

  - name: real-15-chips-match-tool-question
    source: |
      ### 15. Chat chips don't match Sig's question
      "My app is slow" -> Sig: "which tool are you using when it's running slow?" -> chips **Blocking my work / Slowing me down / Nice-to-have**.
      - Sig asked for the tool, so the chips should be the tools (apps), plus "Not sure". Impact chips under a tool question make no sense.
      - The person already said "slow", so the impact is known (slowing them down). The impact question and its chips should not come up at all; infer it and let the confirm card show it.
    messages:
      - "My app is slow"
      - "AFSS Portal"
      - "the statement list takes ages to load"
    expect: card
    require: []
    forbid: ["nice-to-have", "stopping you", "nuisance", "—"]
    good: Ask which tool with the tools as chips, ask what is slow, then show the card with Slowing me down already filled in.
    card: {project: AFSS Portal, kind: problem, impact: Slowing me down}
    chips: [tools, no_impact, card]
    never_ask: [how much it affects their work]
    never_repeat: [which tool]

  - name: real-16-already-said-slow
    source: |
      ### 16. Sig asks again after the person says they already answered
      Same chat, continued: "AFSS Portal" -> "Is it stopping you from getting your work done, or is it just a bit of a nuisance?" -> "I already said it's slow" -> a four-line reply that apologises, explains why it needs to know, and asks the same thing again, with the same three chips.
      - When someone pushes back ("I already said", "I told you"), Sig takes what they said, doesn't ask again, and moves on: "Got it, slowing you down." Never repeat a question.
      - "Slow" means "Slowing me down" (major). Replies stay short (two lines), no dashes as punctuation. "Nice-to-have" for a slow tool doesn't make sense.
    messages:
      - "My app is slow"
      - "AFSS Portal"
      - "I already said it's slow"
      - "the statement list takes ages to load"
    expect: card
    require: []
    forbid: ["nice-to-have", "stopping you", "nuisance", "need to know", "—"]
    good: Take the pushback as the answer, say "Got it, slowing you down." and move on; no apology speech, no repeated question.
    card: {project: AFSS Portal, kind: problem, impact: Slowing me down}
    chips: [tools, no_impact, no_impact, card]
    never_ask: [how much it affects their work]
    never_repeat: [which tool, what is slow]

  - name: real-18-question-about-sig-is-not-feedback
    source: |
      ### 18. A question about Sig itself becomes a feedback card
      Seen 26 Oct (Aisha): "what is your role" -> a good answer. "RAKE Agent" -> "What's happening with RAKE Agent?" -> "why do we need you when we already have rake rgent" -> a sensible answer, then straight on "Here's what I'll send" and a card: RAKE Agent · No change · Question · "Purpose of feedback channel vs RAKE Agent" · Minor.
      - Nobody reported anything. Asking about Sig, Smoke Signal or how it differs from RAKE is chat, not feedback; it must never produce a card. Answer in two lines at most, then "Anything you'd like to tell the team about?".
      - Also: "are you a bot?" and "who made you?" end with no card.
    messages:
      - "what is your role"
      - "RAKE Agent"
      - "why do we need you when we already have rake rgent"
    expect: no_card
    require: ["anything you'd like to tell the team"]
    forbid: ["here's what i'll send", "—"]
    good: Answer what Sig is, then how it differs from RAKE (RAKE answers policy questions, Sig passes feedback to the team), two lines each, then "Anything you'd like to tell the team about?".
    chips: [none, no_impact, none]
    never_ask: [how much it affects their work, which tool]
    never_repeat: [what's happening with RAKE Agent]

  # The product owner's own chat of 27 Oct (review items 21 to 23)

  - name: real-23-goformz-slow-then-submit-fails
    source: |
      ### 21 to 23. Seen 27 Oct (Mei Lin): "I'm having trouble with my app it's so slow" -> "Which app or site?" -> "GoFormz Extension Portal" -> straight to the impact question with impact chips -> the submission description -> "Here's what I'll send" and the card at once.
      - "So slow" already says the impact: no impact question (21, 15).
      - Ask about the problem itself before the card (23): which form, any error, every time, since when.
      - The opening "so slow" isn't on the card: if the later description is a different problem, ask whether it's the same issue or a second one; never drop it (23).
    messages:
      - "I'm having trouble with my app it's so slow"
      - "GoFormz Extension Portal"
      - "There's this part in form submission when i pressed submit it failed to do the task and then resets all my filled forms"
      - "same thing, it hangs for ages when I press submit and then it fails"
      - "every time since Monday, no error message"
    expect: card
    require: []
    forbid: ["nice-to-have", "stopping you", "nuisance", "—"]
    good: Tool chips first, then what is slow; on the submission failure, check whether that is the slowness or a second problem; card with the slowness and the failed submission together, Slowing me down or Blocking.
    card: {project: GoFormz Extension Portal, kind: problem}
    chips: [tools, no_impact, no_impact]
    never_ask: [how much it affects their work]
    never_repeat: [which tool]
    asks_details: true
    keeps: ["slow", "hang", "ages"]

