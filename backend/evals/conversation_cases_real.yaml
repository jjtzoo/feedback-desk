    chips: [no_impact, no_impact, card]
    never_ask: [which tool]
    never_repeat: [which browser]
    revised: "2026-10-30: never_ask had how often, which the judge reads as every details question, so asking which screen failed it; the words how often and since when are now forbidden directly"

