# Feedback: local development (spec v3 D25). Staging and production run on Cloud Run
# (deploy.sh / deploy.ps1, docs/deployment.md); this file is never used for them.
#   cp .env.example .env
#   docker compose --profile dev up --build
#   docker compose exec api python -m app.seed

x-backend: &backend
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    STORAGE_DIR: /srv/.uploads
    # gcloud application-default credentials, mounted read-only, for Vertex AI (D8).
    CLOUDSDK_CONFIG: /gcloud
  volumes:
    - ${GCLOUD_CONFIG_DIR:-./.gcloud-empty}:/gcloud:ro
    - uploads:/srv/.uploads
  depends_on:
    db:
      condition: service_healthy

services:
  db:
    # PostgreSQL 16 per the brief; D31 may move this to 17 (company Cloud SQL standard).
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *backend
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health').status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker-heartbeat') < 60 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

  web:
    build:
      context: ./web
      target: dev
    environment:
      API_ORIGIN: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./web/src:/web/src
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/sign-in"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.27
    profiles: ["dev"]
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  uploads:
